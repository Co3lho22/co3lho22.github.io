---
layout: default
---

<article class="writeup">
  <header class="writeup-header">
    <a href="/writeups/" class="back-link">← Writeups</a>
    <h1 class="writeup-title">{{ page.title }}</h1>
    <div class="writeup-meta">
      <span class="competition">{{ page.competition }}</span>
      <span class="category">{{ page.category }}</span>
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %Y" }}</time>
    </div>
  </header>

  <div class="writeup-content">
    {{ content }}
  </div>

  <footer class="writeup-footer">
    <a href="/writeups/" class="back-to-writeups">← Back to Writeups</a>
  </footer>
</article>
